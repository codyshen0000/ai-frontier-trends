<!DOCTYPE html>

<link rel="stylesheet" href="../lookalike/css/site.css"/>

<body>
<!-- G6 shell sample: visible AI 评分 on 精选 cards. Screenshot later. -->
<div class="shell">
  <aside class="sidebar" aria-label="主导航">

  <div style="flex:1;min-width:0">

      <div class="page-head">

        </div>
      </div>
      <article class="card feed-card" data-item-id="sample-1">
        <div class="feed-card-top">
          <div class="feed-source"><span class="avatar">官</span>公开实验室 · 精选</div>

      </article>
      <article class="card feed-card" data-item-id="sample-2">
        <div class="feed-card-top">
          <div class="feed-source"><span class="avatar">社</span>社区复测</div>
          <span class="ft-rating" data-ft-rating="74">AI 评分<span class="num">74</span></span>

        <p class="feed-summary">厂商强调静音续航下的本地助手；评测口径仍不统一。</p>
        <p class="feed-reason"><strong>推荐理由：</strong>产品档第一次把本地推理写成默认卖点。</p>
