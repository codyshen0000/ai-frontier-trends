name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout engine-data snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: engine-data
          path: .engine-data
          persist-credentials: false
          sparse-checkout: data/engine/v1

      - name: Place engine snapshot
        run: |
          mkdir -p data/engine
          rm -rf data/engine/v1
          cp -a .engine-data/data/engine/v1 data/engine/v1
          rm -rf .engine-data
          test -f data/engine/v1/meta.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build public site
        run: npm run build:public

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
