# Deploy the public static site to GitHub Pages.
#
# Do NOT add a `push` trigger for branch `engine-data`. GitHub runs the
# workflow file from the pushed ref; that branch is data-only and has no
# workflow file, so a push there would never start this job on main.
# R1 must call workflow_dispatch (or repository_dispatch) after it pushes
# engine-data. The hourly cron is a backup.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [engine-data-updated]
  schedule:
    # UTC. Hourly cadence; minute 40 lags the typical :00 data export.
    - cron: "40 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue instead of cancelling: a cancelled deploy can leave Pages mid-update.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout engine-data snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: engine-data
          path: .engine-data
          persist-credentials: false
          sparse-checkout: data/engine/v1

      - name: Place engine snapshot
        run: |
          mkdir -p data/engine
          rm -rf data/engine/v1
          cp -a .engine-data/data/engine/v1 data/engine/v1
          rm -rf .engine-data
          test -f data/engine/v1/meta.json
          echo "FT_ENGINE_DIR=${GITHUB_WORKSPACE}/data/engine/v1" >> "${GITHUB_ENV}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build public site
        run: npm run build:public

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
