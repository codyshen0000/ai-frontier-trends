name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install MIT static deps
        run: npm ci --prefix scripts/mit-static

      - name: Engine data contract
        run: npm run test:engine-data

      - name: Build public site
        run: npm run build:public

      - name: Verify information architecture
        run: npm run verify:ia
